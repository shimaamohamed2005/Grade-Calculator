<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>
<body>
    <div class="analyzer-box">
        <h3>محلل درجات الطالب</h3>

        <label>الدرجه الاولى:</label>
        <input type="number" id="grade1" placeholder="مثال:85">

        <label>الدرجه الثانية:</label>
        <input type="number" id="grade2" placeholder="مثال:90">

        <label>الدرجه الثالثة:</label>
        <input type="number" id="grade3" placeholder="مثال:75">

        <label>(%) نسبه الحضور:</label>
        <input type="number" id="attendance" placeholder="مثال:80">
        <button id="analyzeBtn">تحليل النتيجة</button>
         <div id="reportBox" class="report"></div>
    </div>
</body>
</html>
